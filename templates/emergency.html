{% extends 'base.html' %}
{% block content %}
<section class="page active">
  <article class="panel emergency-panel">
    <div class="section-title">
      <span>!</span>
      <div>
        <h2>Emergency Help</h2>
        <p>Create emergency guidance with chemical, symptoms, and location. Use the call buttons for urgent help.</p>
      </div>
    </div>
    <input id="chemicalInput" placeholder="Chemical name if known">
    <textarea id="symptomText" rows="3" placeholder="Symptoms or what happened"></textarea>
    <div class="button-row">
      <button id="locationBtn" type="button">Use location</button>
      <button id="alertBtn" type="button">Create message</button>
    </div>
    <textarea id="emergencyMessage" rows="5" readonly placeholder="Emergency message will be generated here."></textarea>
    <div class="button-row">
      <a class="button-link danger-link" href="tel:112">Call 112</a>
      <a class="button-link secondary" href="tel:1800116117">Call poison helpline</a>
    </div>
  </article>
</section>
{% endblock %}

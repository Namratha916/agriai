{% extends 'base.html' %}
{% block content %}
<section class="page active">
  <article class="panel">
    <div class="section-title">
      <span>H</span>
      <div>
        <h2>Nearby Hospital Finder</h2>
        <p>Open a map search for hospitals or poison support near your position.</p>
      </div>
    </div>
    <div class="hospital-actions">
      <button id="locationBtn" type="button">Use location</button>
      <a class="button-link danger-link" href="tel:112">Call 112</a>
      <a id="hospitalLink" class="button-link" href="https://www.google.com/maps/search/nearest+hospital" target="_blank" rel="noreferrer">Nearest hospital</a>
      <a class="button-link secondary" href="https://www.google.com/maps/search/poison+control+center" target="_blank" rel="noreferrer">Poison control center</a>
      <a class="button-link secondary" href="tel:1800116117">Call 1800-116-117</a>
    </div>
  </article>
</section>
{% endblock %}
